<!doctype html><html lang="en"><meta charset="utf-8"><title>Kiwi upgrade artwork</title><style>body{margin:24px;background:#f8f6ec;color:#34463b;font:16px system-ui}h1{font-size:25px}p{max-width:800px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}figure{margin:0}.art{background:#e5edd4;border-radius:14px;aspect-ratio:3/2;display:flex;align-items:center;overflow:hidden}.art svg{width:100%;max-height:100%;display:block}figcaption{font-weight:650;padding:8px 0 16px}@media(max-width:800px){main{grid-template-columns:1fr 1fr}}</style><h1>Kiwi Clicker · upgrade artwork</h1><p>Approved kiwi reused throughout. Transparent parts, mechanical contact states, and matching button lighting.</p><main id="gallery"></main><script type="module">
const assets=[['Clockwork poker · ready','clockwork/assembled-idle.svg'],['Clockwork poker · pressing','clockwork/pressed.svg'],['Night-shift flock · one row','flock/flock-idle.svg'],['Pressing factory · ready','factory/assembled-idle.svg'],['Pressing factory · pressing','factory/pressed.svg'],['Worm snack tin','snacks/assembled-idle.svg'],['Worm farm','worms/assembled-idle.svg'],['Gold sleeve · fitted to approved kiwi','gold/idle.svg'],['Linked double buttons','double/kiwi-idle.svg']];
for(const [name,file]of assets){const url=new URL(file,location.href);const text=await(await fetch(url)).text();const doc=new DOMParser().parseFromString(text,'image/svg+xml');const svg=doc.documentElement;for(const image of svg.querySelectorAll('image')){const href=image.getAttribute('href');image.setAttribute('href',new URL(href,url).href);image.removeAttribute('xlink:href');}const f=document.createElement('figure');const div=document.createElement('div');div.className='art';div.append(document.importNode(svg,true));const caption=document.createElement('figcaption');caption.textContent=name;f.append(div,caption);document.getElementById('gallery').append(f);}
</script></html>
