<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connected kiwi conga</title>
<style>body{font:16px system-ui;background:#faf7ee;color:#36453c;margin:28px}main{max-width:700px}article{background:#fff;border:1px solid #d8dfcc;border-radius:18px;padding:16px;width:440px;max-width:calc(100vw - 90px)}.art{background:#e5edd6;height:230px;border-radius:12px}canvas{width:100%;height:230px;display:block}button,select{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid #a7b29a;background:white}nav{display:flex;gap:12px;margin:20px 0;flex-wrap:wrap}input{width:100%}.dark .art{background:#243428}.checker .art{background:conic-gradient(#ddd 25%,#fff 0 50%,#ddd 0 75%,#fff 0) 0 0/18px 18px}.note{line-height:1.5}</style>
<main><h1>Kiwi conga · connected poses</h1><p class="note">Staggered steps with connected heads and necks. The lead lifts its bill clear, leans into the cap, then releases.</p><nav><button id="play">Pause</button><select id="bg" aria-label="Background"><option value="">Game green</option><option value="dark">Dark</option><option value="checker">Transparency grid</option></select></nav><article><div class="art"><canvas width="880" height="460" aria-label="Connected kiwi conga animation"></canvas></div><h2>Kiwi conga line</h2><input id="phase" aria-label="Loop position" type="range" min="0" max="1000" value="0"><p id="status">Loading…</p></article><p class="note">Raised step → planted stance → opposite step → planted stance.<br>Birds stay fully visible. The button housing stays fixed.</p></main>
<script type="module">import{createRenderer}from '../renderer.js';const m=await(await fetch('../manifest.json')).json(),r=await createRenderer(m),c=document.querySelector('canvas'),slider=document.querySelector('#phase'),play=document.querySelector('#play');let playing=true,start=performance.now(),frozen=0;play.onclick=()=>{if(playing){frozen=performance.now()-start;playing=false}else{start=performance.now()-frozen;playing=true}play.textContent=playing?'Pause':'Play'};slider.oninput=()=>{frozen=Number(slider.value)/1000*m.scenes.conga.durationMs;playing=false;play.textContent='Play'};document.querySelector('#bg').onchange=e=>document.body.className=e.target.value;function frame(now){const time=playing?now-start:frozen,s=r(c,'conga',time);slider.value=Math.round(s.phase*1000);document.querySelector('#status').textContent=Math.round(s.phase*100)+'% · 3 second loop';requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
